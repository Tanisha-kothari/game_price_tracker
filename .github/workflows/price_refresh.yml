name: Automated Price Refresh (6 Hours)

on:
  schedule:
    # Runs every 6 hours: at 00:00, 06:00, 12:00, and 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: price-refresh-job
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-prices:
    name: Refresh Game Prices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run canonical price checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          SEND_UNCHANGED_SUMMARY: ${{ secrets.SEND_UNCHANGED_SUMMARY }}
        run: |
          python checker.py
